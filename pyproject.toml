[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-ui-testability-contract"
version = "0.4.0"
description = "Local CLI and Agent Skill for diagnosing XCUITest element lookup and deterministic launch failures in SwiftUI and UIKit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Kristijan Kofiloski" }
]
keywords = [
  "accessibility",
  "accessibility-identifier",
  "ai-agent",
  "ai-skill",
  "automation",
  "codex-skill",
  "ios",
  "ios-ai-ui-check",
  "ios-testing",
  "swiftui",
  "test-automation",
  "ui-testing",
  "uikit",
  "xcuitest",
  "xcode",
  "xcode-ui-testing"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Kofiloski/ios-ui-testability-contract-skill"
Repository = "https://github.com/Kofiloski/ios-ui-testability-contract-skill"
Documentation = "https://github.com/Kofiloski/ios-ui-testability-contract-skill#readme"
Issues = "https://github.com/Kofiloski/ios-ui-testability-contract-skill/issues"
Changelog = "https://github.com/Kofiloski/ios-ui-testability-contract-skill/releases"

[project.scripts]
ios-ui-testability = "ios_ui_testability_contract.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
