name: Publish to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact package release tag in vX.Y.Z form
        required: true
        type: string

concurrency:
  group: pypi-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install build

      - name: Run repository checks
        run: ./scripts/check-skill.sh

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          expected_version="${RELEASE_TAG#v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          runtime_version="$(PYTHONPATH=src python -c 'from ios_ui_testability_contract import __version__; print(__version__)')"
          citation_version="$(python scripts/read-citation-version.py)"

          if [[ "${package_version}" != "${expected_version}" || "${runtime_version}" != "${expected_version}" || "${citation_version}" != "${expected_version}" ]]; then
            echo "Release ${expected_version} does not match package ${package_version}, runtime ${runtime_version}, and citation ${citation_version}" >&2
            exit 1
          fi

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify built wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          ios-ui-testability --version
          ios-ui-testability --help

      - name: Store distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions with Trusted Publishing
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ios-ui-testability-contract
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true
