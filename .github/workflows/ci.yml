name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        shell: bash
        run: python -m pip install .

      - name: Run skill checks
        shell: bash
        run: ./scripts/check-skill.sh

      - name: Validate distributable Agent Skill
        shell: bash
        run: gh skill publish --dry-run "${GITHUB_WORKSPACE}/skills"

      - name: Smoke-test installed CLI and version
        shell: bash
        run: |
          ios-ui-testability --help
          package_version="$(python -c 'from importlib.metadata import version; print(version("ios-ui-testability-contract"))')"
          runtime_version="$(python -c 'from ios_ui_testability_contract import __version__; print(__version__)')"
          cli_version="$(ios-ui-testability --version)"

          if [[ "${package_version}" != "${runtime_version}" || "${package_version}" != "${cli_version}" ]]; then
            echo "Version mismatch: package=${package_version}, runtime=${runtime_version}, cli=${cli_version}" >&2
            exit 1
          fi

          ios-ui-testability triage \
            --summary tests/fixtures/sample_failure_bundle/summary.md \
            --ui-tree tests/fixtures/sample_failure_bundle/ui-tree.json \
            --scenario tests/fixtures/sample_failure_bundle/scenario.json \
            --planner-validation-error tests/fixtures/sample_failure_bundle/planner-validation-error.txt \
            --report-mode patch-plan
