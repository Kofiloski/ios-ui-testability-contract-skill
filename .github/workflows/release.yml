name: Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Exact package version prefixed with v, in vX.Y.Z form
        required: true
        type: string
      update_major_tag:
        description: Also force-update the moving major tag, for example v0
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          if [[ ! "${VERSION_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "version_tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          echo "major_tag=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "release_version=${VERSION_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run skill checks
        shell: bash
        run: ./scripts/check-skill.sh

      - name: Validate distributable Agent Skill
        shell: bash
        run: gh skill publish --dry-run "${GITHUB_WORKSPACE}/skills"

      - name: Install package
        shell: bash
        run: python -m pip install .

      - name: Validate package and runtime versions
        shell: bash
        env:
          REQUESTED_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          package_version="$(python -c 'from importlib.metadata import version; print(version("ios-ui-testability-contract"))')"
          runtime_version="$(python -c 'from ios_ui_testability_contract import __version__; print(__version__)')"
          cli_version="$(ios-ui-testability --version)"
          citation_version="$(python scripts/read-citation-version.py)"

          if [[ "${package_version}" != "${REQUESTED_VERSION}" ]]; then
            echo "Requested release ${REQUESTED_VERSION} does not match installed package metadata ${package_version}" >&2
            exit 1
          fi

          if [[ "${runtime_version}" != "${REQUESTED_VERSION}" ]]; then
            echo "Requested release ${REQUESTED_VERSION} does not match runtime version ${runtime_version}" >&2
            exit 1
          fi

          if [[ "${cli_version}" != "${REQUESTED_VERSION}" ]]; then
            echo "Requested release ${REQUESTED_VERSION} does not match CLI version ${cli_version}" >&2
            exit 1
          fi

          if [[ "${citation_version}" != "${REQUESTED_VERSION}" ]]; then
            echo "Requested release ${REQUESTED_VERSION} does not match citation version ${citation_version}" >&2
            exit 1
          fi

          ios-ui-testability --help

      - name: Configure git author
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure release tag
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${VERSION_TAG}:refs/tags/${VERSION_TAG}"
            tag_commit="$(git rev-list -n 1 "refs/tags/${VERSION_TAG}")"
            head_commit="$(git rev-parse HEAD)"
            if [[ "${tag_commit}" != "${head_commit}" ]]; then
              echo "Tag ${VERSION_TAG} already exists on ${tag_commit}, not current commit ${head_commit}" >&2
              exit 1
            fi
            echo "Tag ${VERSION_TAG} already points at the current commit; resuming release."
          else
            if git rev-parse -q --verify "refs/tags/${VERSION_TAG}" >/dev/null; then
              tag_commit="$(git rev-list -n 1 "refs/tags/${VERSION_TAG}")"
              head_commit="$(git rev-parse HEAD)"
              if [[ "${tag_commit}" != "${head_commit}" ]]; then
                echo "Local tag ${VERSION_TAG} points at ${tag_commit}, not current commit ${head_commit}" >&2
                exit 1
              fi
            else
              git tag -a "${VERSION_TAG}" -m "Release ${VERSION_TAG}"
            fi
            git push origin "refs/tags/${VERSION_TAG}"
          fi

      - name: Update moving major tag
        if: ${{ inputs.update_major_tag }}
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
          MAJOR_TAG: ${{ steps.version.outputs.major_tag }}
        run: |
          git tag -fa "${MAJOR_TAG}" -m "Release ${VERSION_TAG}"
          git push origin "refs/tags/${MAJOR_TAG}" --force

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          if gh release view "${VERSION_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${VERSION_TAG} already exists; nothing to create."
          else
            gh release create "${VERSION_TAG}" \
              --title "${VERSION_TAG}" \
              --generate-notes
          fi

      - name: Dispatch top-level PyPI publishing workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          gh workflow run publish-pypi.yml \
            --ref "${VERSION_TAG}" \
            --field release_tag="${VERSION_TAG}"
